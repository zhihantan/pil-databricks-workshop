# Genie space configuration for the PIL workshop.
#
# Consumed by setup/06_create_genie_space.py, which builds a v2 serialized_space
# and creates the space via the Genie API — so the space ships WITH instructions,
# trusted example-SQL, and benchmarks (not UI-only). ${catalog} is substituted.
#
# Authored to Databricks Genie best practices (docs.databricks.com/genie-agents/
# best-practices + FE internal guidance):
#   * Metric-view / semantic-layer first; keep the table set focused.
#   * Prefer example SQL over prose; keep text instructions tight (<~2000 chars).
#   * Define business terms; give a clarification pattern; put summary rules last.
#   * Trusted assets (example_sqls) teach Genie verified query patterns.
#   * Benchmarks enable systematic accuracy scoring.

title: "PIL Shipping Operations — Genie"
description: >
  Natural-language analytics over Pacific International Lines' container-liner
  operations — schedule reliability, vessel utilization, port performance,
  revenue, sustainability, and working capital — on the governed gold layer.

warehouse: SERVERLESS   # resolved to a serverless SQL warehouse id at runtime

# Curated, focused table list — gold materialized + metric views only (never
# bronze/silver). Genie Agents favour a small, well-modeled set.
tables:
  - ${catalog}.gold.mv_daily_operations_kpis
  - ${catalog}.gold.mv_port_performance
  - ${catalog}.gold.mv_customer_revenue
  - ${catalog}.gold.metric_schedule_reliability
  - ${catalog}.gold.metric_vessel_utilization
  - ${catalog}.gold.metric_revenue
  - ${catalog}.gold.metric_sustainability
  - ${catalog}.gold.metric_working_capital
  - ${catalog}.gold.metric_port_dwell_turnaround
  # Analytics views backing the newer dashboard themes (finance/AR, ML inventory
  # planning, container repositioning). The last two are built by notebooks 11/12,
  # so 06 filters the table list to what exists — on a fresh run they bind on the
  # daily re-run after 11/12 have populated them.
  - ${catalog}.gold.v_financial_health
  - ${catalog}.gold.v_inventory_planning
  - ${catalog}.gold.v_repositioning_summary

# ---------------------------------------------------------------------------
# General text instructions (concise; semantic-layer-first). Kept well under
# the ~2000-char guideline. Business definitions + a clarification rule + a
# trailing summary-formatting section (only text instructions affect summaries).
# ---------------------------------------------------------------------------
text_instructions: |
  You are the analytics assistant for PIL (Pacific International Lines), a global
  container shipping line. Answer over the governed `${catalog}.gold` layer only
  (never bronze/silver). Be concise; state the grain and any filters you applied.
  Format money as USD, TEU as whole numbers, and rates/percentages to 1 decimal.

  SEMANTIC LAYER — prefer the metric views for aggregated KPIs and query their
  measures with MEASURE(); use the mv_* views for time series and detail:
  - metric_schedule_reliability — MEASURE(`Schedule Reliability %`), `Total Legs`,
    `On-Time Legs`, `Avg Arrival Delay (hrs)`; dims: `Arrival Month`, `Destination Port`.
  - metric_vessel_utilization — MEASURE(`Vessel Utilization %`), `Loaded TEU`, `Capacity TEU`.
  - metric_revenue — MEASURE(`Revenue per TEU (USD)`), `Freight Revenue (USD)`,
    `Demurrage & Detention Revenue (USD)`, `Total Revenue (USD)`, `TEU Shipped`;
    dims: `Month`, `Trade Lane`, `Customer Segment`, `Customer Industry`.
  - metric_sustainability — MEASURE(`Fuel Efficiency (mt per 1k TEU-nm)`),
    `CO2 per TEU-km`; dims: `Vessel Class`, `Fuel Type`, `Month`.
  - metric_working_capital — MEASURE(`DSO (days)`), `Billed (USD)`, `Overdue Count`.
  - metric_port_dwell_turnaround — MEASURE(`Vessel Turnaround Time (hrs)`),
    `Avg Waiting Time (hrs)`; dim: `Port`.
  Example: SELECT `Trade Lane`, MEASURE(`Revenue per TEU (USD)`)
  FROM ${catalog}.gold.metric_revenue GROUP BY `Trade Lane`.

  ANALYTICS VIEWS (plain gold views — aggregate directly, no MEASURE()):
  - v_financial_health — invoice-level receivables: dso_days, days_overdue,
    aging_bucket (Current/1-30/31-60/61-90/90+ days/Paid), outstanding_usd,
    is_disputed, status, customer_name, credit_terms. For AR aging, SUM
    outstanding_usd GROUP BY aging_bucket; "cash at risk" = SUM(outstanding_usd).
  - v_inventory_planning — spare-parts demand forecast vs reorder logic:
    stockout_risk ('At risk'/'OK'), suggested_reorder_qty, forecast_value_usd,
    lead_time_demand, reorder_point, category, depot. "SKUs at risk" =
    COUNT(*) WHERE stockout_risk='At risk'.
  - v_repositioning_summary — empty-container OR-Tools plan: containers, cost_usd,
    cost_per_container, move_type ('Intra-region'/'Inter-region'), from_port/
    to_port, from_region/to_region. Rank lanes by containers or cost_usd.

  BUSINESS DEFINITIONS:
  - A voyage leg is LATE when actual arrival is >24h after pro-forma ETA;
    "schedule reliability %" = on-time legs / total legs.
  - "Vessel utilization %" = loaded TEU / capacity TEU (manifest-based).
  - "Revenue per TEU" = (freight + demurrage & detention) / TEU.
  - "D&D" = demurrage & detention. "DSO" = days sales outstanding (issue→paid).
  - "Fuel efficiency" = mt fuel per 1,000 TEU-nautical-miles (lower is better).
  - TEU = twenty-foot equivalent unit; a 40ft container = 2 TEU.
  - "Trade lane" = origin region → destination region.
  Default to the LAST 12 MONTHS unless the user specifies a period. "Last quarter"
  = the most recent completed calendar quarter.

  CLARIFICATION: When a user asks about "performance" or "revenue" without a
  period, trade lane, or metric, ask one clarifying question before answering,
  e.g. "Which period and trade lane, and are you interested in reliability,
  utilization, or revenue?"

  Instructions you must follow when providing summaries:
  - State the time period and grain covered by the result.
  - Name the metric view or table used.
  - Lead with the headline number, then 1–2 drivers; use bullets for multi-part answers.

# ---------------------------------------------------------------------------
# Trusted example SQL (teaches Genie verified query patterns). Each becomes an
# example_question_sql in the space. Reference real gold columns/measures.
# ---------------------------------------------------------------------------
example_sqls:
  - question: "What is our overall schedule reliability over the last 12 months?"
    sql: |
      SELECT MEASURE(`Schedule Reliability %`) AS schedule_reliability_pct
      FROM ${catalog}.gold.metric_schedule_reliability
      WHERE `Arrival Month` >= ADD_MONTHS(DATE_TRUNC('MONTH', CURRENT_DATE()), -12)
    usage_guidance: "Use metric_schedule_reliability with MEASURE() for reliability; filter by Arrival Month."
  - question: "Which 5 ports have the worst average turnaround time?"
    sql: |
      SELECT port_name, region, avg_turnaround_hrs
      FROM ${catalog}.gold.mv_port_performance
      ORDER BY avg_turnaround_hrs DESC
      LIMIT 5
    usage_guidance: "Port rankings come from mv_port_performance (already aggregated per port)."
  - question: "What is revenue per TEU by trade lane?"
    sql: |
      SELECT `Trade Lane`, MEASURE(`Revenue per TEU (USD)`) AS revenue_per_teu
      FROM ${catalog}.gold.metric_revenue
      GROUP BY `Trade Lane`
      ORDER BY revenue_per_teu DESC
    usage_guidance: "Revenue-per-TEU and D&D revenue live in metric_revenue; slice by Trade Lane / Customer Segment."
  - question: "Compare fuel efficiency between LNG and VLSFO vessels."
    sql: |
      SELECT `Fuel Type`, MEASURE(`Fuel Efficiency (mt per 1k TEU-nm)`) AS fuel_eff
      FROM ${catalog}.gold.metric_sustainability
      GROUP BY `Fuel Type`
    usage_guidance: "Sustainability KPIs (fuel efficiency, CO2 per TEU-km) come from metric_sustainability."
  - question: "What is our current DSO and how many invoices are overdue?"
    sql: |
      SELECT MEASURE(`DSO (days)`) AS dso_days, MEASURE(`Overdue Count`) AS overdue
      FROM ${catalog}.gold.metric_working_capital
    usage_guidance: "Working-capital KPIs (DSO, overdue, billed) come from metric_working_capital."
  - question: "Show our accounts-receivable aging — outstanding balance by aging bucket."
    sql: |
      SELECT aging_bucket, ROUND(SUM(outstanding_usd),0) AS outstanding_usd,
             COUNT(*) AS invoices
      FROM ${catalog}.gold.v_financial_health
      GROUP BY aging_bucket
      ORDER BY outstanding_usd DESC
    usage_guidance: "AR aging + cash-at-risk come from v_financial_health (plain view; SUM outstanding_usd by aging_bucket)."
  - question: "Which spare parts are at risk of stockout, and what should we reorder?"
    sql: |
      SELECT sku_code, category, depot, lead_time_days, suggested_reorder_qty
      FROM ${catalog}.gold.v_inventory_planning
      WHERE stockout_risk = 'At risk'
      ORDER BY suggested_reorder_qty DESC
      LIMIT 15
    usage_guidance: "Stockout risk + reorder suggestions come from v_inventory_planning (forecast joined to reorder point)."
  - question: "What are the largest empty-container repositioning moves and their cost?"
    sql: |
      SELECT from_port, to_port, containers, cost_usd
      FROM ${catalog}.gold.v_repositioning_summary
      ORDER BY containers DESC
      LIMIT 10
    usage_guidance: "Repositioning moves + cost come from v_repositioning_summary (the OR-Tools min-cost-flow plan)."

# ---------------------------------------------------------------------------
# Common (sample) questions shown to users. These are NOT AI-generated guesses —
# they are the exact questions that PASSED the Genie benchmark eval (assessed
# GOOD on the live space), so users are shown prompts Genie is verified to answer
# correctly. Re-derive with setup/06's benchmark eval if the model/data changes.
# ---------------------------------------------------------------------------
sample_questions:
  - "What is our overall schedule reliability over the last 12 months?"
  - "Which 5 ports have the worst average turnaround time?"
  - "What is revenue per TEU by trade lane?"
  - "What is our current DSO and how many invoices are overdue?"
  - "Show total revenue by customer industry."
  - "Show our accounts-receivable aging — outstanding balance by aging bucket."
  - "Which spare parts are at risk of stockout, and what should we reorder?"
  - "What are the largest empty-container repositioning moves and their cost?"

# ---------------------------------------------------------------------------
# Benchmarks (verified Q&A with expected SQL) for systematic accuracy scoring.
# ---------------------------------------------------------------------------
benchmarks:
  - question: "What is our overall schedule reliability over the last 12 months?"
    sql: |
      SELECT MEASURE(`Schedule Reliability %`)
      FROM ${catalog}.gold.metric_schedule_reliability
      WHERE `Arrival Month` >= ADD_MONTHS(DATE_TRUNC('MONTH', CURRENT_DATE()), -12)
  - question: "Which 5 ports have the worst average turnaround time?"
    sql: |
      SELECT port_name, avg_turnaround_hrs
      FROM ${catalog}.gold.mv_port_performance
      ORDER BY avg_turnaround_hrs DESC LIMIT 5
  - question: "What is revenue per TEU by trade lane?"
    sql: |
      SELECT `Trade Lane`, MEASURE(`Revenue per TEU (USD)`)
      FROM ${catalog}.gold.metric_revenue GROUP BY `Trade Lane`
  - question: "Compare fuel efficiency between LNG and VLSFO vessels."
    sql: |
      SELECT `Fuel Type`, MEASURE(`Fuel Efficiency (mt per 1k TEU-nm)`)
      FROM ${catalog}.gold.metric_sustainability GROUP BY `Fuel Type`
  - question: "What is our current DSO and how many invoices are overdue?"
    sql: |
      SELECT MEASURE(`DSO (days)`), MEASURE(`Overdue Count`)
      FROM ${catalog}.gold.metric_working_capital
  - question: "Show total revenue by customer industry."
    sql: |
      SELECT `Customer Industry`, MEASURE(`Total Revenue (USD)`)
      FROM ${catalog}.gold.metric_revenue GROUP BY `Customer Industry`
