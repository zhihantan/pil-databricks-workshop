# Metric view: Vessel Utilization
# Utilization % = loaded TEU / capacity TEU across legs (manifest-based).
version: 0.1
source: ${catalog}.silver.voyage_legs
dimensions:
  - name: Arrival Month
    expr: DATE_TRUNC('MONTH', eta)
  - name: Voyage
    expr: voyage_id
measures:
  - name: Loaded TEU
    expr: SUM(loaded_teu)
  - name: Capacity TEU
    expr: SUM(capacity_teu)
  - name: Vessel Utilization %
    expr: ROUND(100.0 * SUM(loaded_teu) / NULLIF(SUM(capacity_teu), 0), 1)
  - name: Avg Load Factor
    expr: ROUND(AVG(load_factor), 3)
